name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Migración SQL y escenarios
        run: scripts/probar-sql.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
      - run: npm run build
      - name: Prueba de humo en navegador
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node scripts/smoke.mjs test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: test-results/
